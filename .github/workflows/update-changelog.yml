name: "Update Changelog"

on:
  release:
    types: [released]

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ github.event.release.name }}
          release-notes: ${{ github.event.release.body }}

      # main is a protected branch, so the changelog cannot be pushed
      # directly. Open a pull request with the update instead.
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-changelog-${{ github.event.release.tag_name }}
          base: main
          title: "Update CHANGELOG for ${{ github.event.release.name }}"
          commit-message: "Update CHANGELOG for ${{ github.event.release.name }}"
          body: |
            Automated CHANGELOG update for release ${{ github.event.release.name }}.

            Generated by the `Update Changelog` workflow.
          labels: documentation
          delete-branch: true
